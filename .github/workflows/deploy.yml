name: Publicar no GitHub Pages

# Publica o site no GitHub Pages:
#   • a cada push na branch principal (mudança de código);
#   • de 10 em 10 minutos (para publicar o que foi salvo no painel /admin);
#   • na mão, pelo botão "Run workflow".
# Antes de rodar, em Settings → Pages, escolha "GitHub Actions" como fonte.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Descobrir o endereço do site
        id: endereco
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$repo" = "$owner.github.io" ]; then
            # repositório de usuário: o site fica na raiz
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          else
            # repositório de projeto: o site fica em /nome-do-repositorio/
            echo "base=/$repo/" >> "$GITHUB_OUTPUT"
            echo "url=https://$owner.github.io/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          # Para apontar o site para outro projeto, crie as variáveis
          # PUBLIC_SUPABASE_URL e PUBLIC_SUPABASE_ANON_KEY em Settings → Secrets
          # and variables → Actions → Variables: elas têm prioridade sobre os
          # valores padrão abaixo.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || 'https://pjglrlullnchqazxpvyn.supabase.co' }}
          # Chave anon (legada) do projeto: pública por definição, é a que o navegador
          # usa. A publishable (sb_publishable_...) também serve; basta trocar aqui
          # ou definir a variável PUBLIC_SUPABASE_ANON_KEY no repositório.
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqZ2xybHVsbG5jaHFhenhwdnluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNzc2NTQsImV4cCI6MjEwOTg1MzY1NH0.Z9wc7bdEjIhSOmToVhDGBMC6TRc3oxhek5G2fI-mvlw' }}
          SITE_BASE: ${{ steps.endereco.outputs.base }}
          SITE_URL: https://dg-senac.github.io/casal-na-estrada
        run: npm run build

      # Se o repositório tiver um domínio próprio configurado (arquivo CNAME
      # em public/), o build de domínio próprio já cobre esse caso; aqui
      # sobrescrevemos o CNAME apenas se você criar public/CNAME manualmente.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
