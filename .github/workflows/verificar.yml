name: Verificar build

# Valida sem acessar conteúdo ou segredos de produção, inclusive durante manutenção.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Auditar dependências
        run: npm audit --audit-level=moderate
      - name: Testar segurança e regras editoriais
        run: npm run test:seguranca
      - name: Testar emergência e recuperação (dados fictícios)
        run: npm run test:emergencia
      - name: Conferir imagens e destaque do casal
        run: |
          node tests/trofeus-email-2026-11-20.mjs
          node tests/trofeus-email-23nov2026.mjs
          node tests/trofeu-do-casal.mjs
          node tests/midia-admin-legada.mjs
          node tests/corte-origens.mjs
      - name: Conferir tipos
        run: npx astro check
      - name: Compilar e testar Worker, assets e D1 local
        run: npm run test:cloudflare:local
      - name: Conferir páginas geradas
        run: |
          node tests/cabecalhos-seguranca.mjs
          node tests/acessibilidade.mjs
          node tests/moto-equipamentos.mjs
          node tests/seo-basico.mjs
          node tests/primeira-viagem.mjs
          node tests/visitas-confirmadas.mjs
